<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Splendor Duel</title>
<link rel="stylesheet" href="/style.css?v=home-5">
<!-- 主题皮肤与共享棋盘装饰 -->
<link rel="stylesheet" href="/prototype-variants.css?v=home-5">
</head>
<body>
<header>
  <h1 id="logo" title="回到主页">Splendor Duel</h1>
  <button id="btn-new" class="ghost hidden">新对局</button>
</header>

<!-- 设置面板 -->
<section id="setup" class="panel">
  <div id="setup-home" class="setup-home">
    <button id="home-human" class="home-card">👤 人机对战<small>选难度, 挑战 bot (先后手随机)</small></button>
    <button id="home-resume" class="home-card">📁 继续对局<small>从上次的位置接着下</small></button>
  </div>

  <div id="setup-human" class="setup-home hidden">
    <button class="home-card" data-ms="1000">🌱 简单<small>bot 每步思考 1 秒</small></button>
    <button class="home-card" data-ms="10000">⚔️ 中等<small>bot 每步思考 10 秒</small></button>
    <button class="home-card" data-ms="20000">🔥 困难<small>bot 每步思考 20 秒</small></button>
    <button class="home-card" data-ms="30000">💀 地狱<small>bot 每步思考 30 秒</small></button>
  </div>

  <div id="setup-resume" class="setup-body hidden">
    <p class="hint">点击任意会话从当前位置继续(按原配置重建); 新对局的 URL 会带 #会话文件, 刷新页面自动续局。</p>
    <div id="r-list" class="session-list"><div class="session-empty">加载中...</div></div>
    <button class="btn-back ghost">← 返回</button>
  </div>
</section>

<!-- 对局界面 -->
<section id="game" class="hidden">
  <div id="banner" class="hidden"></div>
  <div class="layout">
    <div class="col board-col">
      <div id="board" class="board"></div>
      <div id="human-controls">
        <div id="human-turn">
          <div id="pick-bar" class="pick-bar"></div>
        </div>
        <div id="move-error" class="error" role="alert"></div>
      </div>
      <div class="pools" id="pool-bag">
        <span id="pool-priv" class="privilege-pool" aria-label="特权池"></span>
      </div>
      <div class="pools pools-royal">
        <div id="pool-royal" aria-label="皇家卡"></div>
      </div>
    </div>
    <div class="col market-col">
      <div id="pyramid"></div>
    </div>
    <div class="col players-col">
      <div id="players"></div>
    </div>
  </div>

  <!-- 行动区 -->
  <div id="actionbar" class="panel">
    <div id="notice" class="notice hidden"></div>
    <div id="agent-controls" class="hidden">
      <button id="btn-step" class="primary">单步 ▶</button>
      <button id="btn-auto" class="primary">自动播放 ⏩</button>
      <label>速度 <input id="speed" type="range" min="100" max="2000" value="800" step="100"></label>
      <span id="turn-indicator"></span>
    </div>
  </div>
</section>

<div id="modal-root" class="modal-overlay hidden">
  <div id="modal-box" class="modal"></div>
</div>

<script type="module" src="/app.js?v=home-5"></script>
</body>
</html>
