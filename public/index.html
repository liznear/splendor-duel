<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>璀璨宝石对决 Arena</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1 id="logo" title="回到主页">💎 璀璨宝石对决 <span class="en">Arena</span></h1>
  <button id="btn-new" class="ghost">新对局</button>
</header>

<!-- 设置面板 -->
<section id="setup" class="panel">
  <div class="tabs">
    <button class="tab active" data-mode="human">👤 人机对战</button>
    <button class="tab" data-mode="agents">🤖 Agent 对战</button>
    <button class="tab" data-mode="resume">📁 继续对局</button>
  </div>

  <div id="setup-human" class="setup-body">
    <label>对手 Agent:
      <select id="h-bot">
        <option value="llm">LLM</option>
        <option value="llm2">LLM2(改进版)</option>
        <option value="llm3">LLM3(分析增强)</option>
        <option value="greedy">贪心bot</option>
        <option value="random">随机bot</option>
        <option value="ab">αβbot(搜索)</option>
        <option value="mcts">MCTSbot(蒙特卡洛)</option>
        <option value="mcts2" selected>MCTS2bot(子树复用)</option>
        <option value="par-mcts2">ParMCTS2bot(8worker并行)</option>
      </select>
    </label>
    <label class="llm-only">模型 (可选, 如 anthropic/claude-sonnet-4-5):
      <input id="h-model" placeholder="留空用默认模型">
    </label>
    <label>执子:
      <select id="h-seat">
        <option value="1">我后手 (先得1特权)</option>
        <option value="0">我先手</option>
      </select>
    </label>
    <label class="search-only">搜索超时 秒 (αβbot/MCTS):
      <input id="h-search-ms" type="number" min="1" max="120" step="1" value="20">
    </label>
    <button id="btn-start" class="primary">开始对局</button>
  </div>

  <div id="setup-agents" class="setup-body hidden">
    <label>先手 Agent:
      <select id="a-p1">
        <option value="greedy">贪心bot</option>
        <option value="llm">LLM</option>
        <option value="llm2">LLM2(改进版)</option>
        <option value="llm3">LLM3(分析增强)</option>
        <option value="random">随机bot</option>
        <option value="ab">αβbot(搜索)</option>
        <option value="mcts">MCTSbot(蒙特卡洛)</option>
        <option value="mcts2">MCTS2bot(子树复用)</option>
        <option value="par-mcts2">ParMCTS2bot(8worker并行)</option>
      </select>
    </label>
    <label>后手 Agent:
      <select id="a-p2">
        <option value="random">随机bot</option>
        <option value="greedy">贪心bot</option>
        <option value="llm">LLM</option>
        <option value="llm2">LLM2(改进版)</option>
        <option value="llm3">LLM3(分析增强)</option>
        <option value="ab">αβbot(搜索)</option>
        <option value="mcts">MCTSbot(蒙特卡洛)</option>
        <option value="mcts2">MCTS2bot(子树复用)</option>
        <option value="par-mcts2">ParMCTS2bot(8worker并行)</option>
      </select>
    </label>
    <label class="llm-only">LLM 模型 (可选):
      <input id="a-model" placeholder="provider/model, 留空用默认">
    </label>
    <label class="search-only">搜索超时 秒 (αβbot/MCTS):
      <input id="a-search-ms" type="number" min="1" max="120" step="1" value="20">
    </label>
    <button id="btn-start-agents" class="primary">开始对局</button>
  </div>

  <div id="setup-resume" class="setup-body hidden">
    <p class="hint">点击任意会话从当前位置继续(按原配置重建); 新对局的 URL 会带 #会话文件, 刷新页面自动续局。</p>
    <div id="r-list" class="session-list"><div class="session-empty">加载中...</div></div>
  </div>
  <p class="hint">规则: 5×5 棋盘拿 token → 买卡攒折扣/分数/皇冠; 胜利条件: 20分 或 10皇冠 或 同色10分。</p>
</section>

<!-- 对局界面 -->
<section id="game" class="hidden">
  <div id="banner" class="hidden"></div>
  <div class="layout">
    <div class="col board-col">
      <div id="board" class="board"></div>
      <div class="pools" id="pool-bag"></div>
      <div class="pools">
        <span>特权池: <b id="pool-priv">-</b></span>
      </div>
      <div class="pools pools-royal">
        <span>皇家卡:</span>
        <div id="pool-royal"></div>
      </div>
    </div>
    <div class="col">
      <div id="pyramid"></div>
    </div>
    <div class="col players-col">
      <h2>玩家</h2>
      <div id="players"></div>
    </div>
  </div>

  <!-- 行动区 -->
  <div id="actionbar" class="panel">
    <div id="notice" class="notice hidden"></div>
    <div id="agent-controls" class="hidden">
      <button id="btn-step" class="primary">单步 ▶</button>
      <button id="btn-auto" class="primary">自动播放 ⏩</button>
      <label>速度 <input id="speed" type="range" min="100" max="2000" value="800" step="100"></label>
      <span id="turn-indicator"></span>
    </div>
    <div id="human-controls">
      <div id="bot-msg" class="hidden">
        <button id="bot-msg-toggle" class="ghost">🤖 LLM 输出 ▸</button>
        <pre id="bot-msg-body" class="hidden"></pre>
      </div>
      <div id="human-turn">
        <div id="pick-bar" class="pick-bar"></div>
        <div id="move-error" class="error"></div>
      </div>
    </div>
  </div>
</section>

<div id="modal-root" class="modal-overlay hidden">
  <div id="modal-box" class="modal"></div>
</div>

<script type="module" src="/app.js"></script>
</body>
</html>
